# Plugin bundle for dsh-dejavu-memory.
# Registers the DejaVu memory tools (noc_boot / read / search /
# create / update / delete). Configure your own DejaVu MCP server:
#
#   - id: dejavu
#     name: 'dsh-dejavu-memory'
#     config:
#       mcp_url: http://localhost:PORT/mcp
#       mcp_auth: Bearer <your token>
- insert:
    - id: dejavu
      name: 'dsh-dejavu-memory'
